
<VirtualHost *:80>
    ServerName 100.78.61.53
    WSGIScriptAlias / /opt/speedofluca/SpeedOfLuca/flaskapp.wsgi
    WSGIDaemonProcess speedofluca user=www-data group=www-data threads=2
    <Directory /opt/speedofluca/SpeedOfLuca/
            Order allow,deny
            Allow from all
    </Directory>
    Alias /static /opt/speedofluca/SpeedOfLuca/static
    <Directory /opt/speedofluca/SpeedOfLuca/static>
            Order allow,deny
            Allow from all
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
